name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Remove progress bar from snake SVGs
        run: |
          python3 - <<'EOF'
          import glob, re

          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  svg = f.read()
              svg = re.sub(r'<rect class="u\b[^"]*"[^>]*/>', "", svg)
              svg = re.sub(r'viewBox="(-?\d+ -?\d+ \d+) 192"', r'viewBox="\1 164"', svg, count=1)
              svg = re.sub(r'height="192"', 'height="164"', svg, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(svg)
          EOF

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
